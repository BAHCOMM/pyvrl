# yaml-language-server: $schema=../../../../schemas/ocsf-mapping.schema.json
# Accepts a finding on its own, or inside an EventBridge event's `detail`.
source: aws_guardduty
let:
  finding: 'if exists(.detail) { .detail } else { . }'
  score: 'to_float(finding.severity) ?? 0.0'
  # Each resource type keeps its identity under its own key.
  resource: finding.resource
  resource_name: >-
    if resource.eksClusterDetails.name != null { resource.eksClusterDetails.name }
    else if resource.rdsDbInstanceDetails.dbInstanceIdentifier != null { resource.rdsDbInstanceDetails.dbInstanceIdentifier }
    else if resource.s3BucketDetails[0].name != null { resource.s3BucketDetails[0].name }
    else if resource.accessKeyDetails.userName != null { resource.accessKeyDetails.userName }
    else if resource.instanceDetails.instanceId != null { resource.instanceDetails.instanceId }
    else { resource.resourceType }
routes:
  - when: finding.id != null && finding.updatedAt != null
    class: detection_finding
    profiles: [cloud]
    fields:
      activity_id: 1
      # GuardDuty scores run from 0 to 10: 1-3.9 low, 4-6.9 medium, 7-8.9 high, 9-10 critical.
      severity_id: 'if score >= 9.0 { 5 } else if score >= 7.0 { 4 } else if score >= 4.0 { 3 } else if score >= 1.0 { 2 } else { 0 }'
      time: 'to_unix_timestamp(parse_timestamp!(finding.updatedAt, "%+"), unit: "milliseconds")'
      finding_info:
        uid: finding.id
        title: finding.title
        desc: finding.description
        types: '[finding.type]'
        created_time: 'to_unix_timestamp(parse_timestamp!(finding.createdAt, "%+"), unit: "milliseconds")'
        modified_time: 'to_unix_timestamp(parse_timestamp!(finding.updatedAt, "%+"), unit: "milliseconds")'
      resources:
        - name: resource_name
          uid: resource.instanceDetails.instanceId
          type: resource.resourceType
      cloud:
        provider: '"AWS"'
        region: finding.region
        account:
          uid: finding.accountId
      metadata:
        uid: finding.id
        product:
          name: '"GuardDuty"'
          vendor_name: '"AWS"'
      raw_data: encode_json(finding)
